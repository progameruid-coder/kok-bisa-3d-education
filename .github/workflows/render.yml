
name: Render KOK BISA Video

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Ensure Remotion browser
        run: npx remotion browser ensure

      - name: Render Venus video
        run: npx remotion render src/index.ts VenusEducation out/venus.mp4

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: kok-bisa-venus-video
          path: out/venus.mp4
